<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="375" viewBox="0 0 1280 375" role="img"><title>Verified rights positions before and after 1 July 2026</title><rect width="1280" height="375" rx="22" fill="#f5f0e6"/><text x="32" y="49" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#142c46">ONE DATE CHANGES WHICH EDITION CAN PARTICIPATE</text><rect x="32" y="87" width="588" height="210" rx="14" fill="#fff" stroke="#ced8d9"/><text x="54" y="128" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#142c46">30 June 2026</text><text x="54" y="172" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#247c89">Applicable rights edition: 1995</text><text x="54" y="218" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142c46">PayLawfulTaxes1995 · ACTIVE</text><text x="54" y="258" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142c46">ChooseOccupationFreely1995 · ACTIVE</text><rect x="660" y="87" width="588" height="210" rx="14" fill="#fff" stroke="#ced8d9"/><text x="682" y="128" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#142c46">1 July 2026</text><text x="682" y="172" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#247c89">Applicable rights edition: 2026</text><text x="682" y="218" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142c46">PayLawfulTaxes · ACTIVE</text><text x="682" y="258" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142c46">ChooseOccupationFreely · ACTIVE</text><text x="32" y="337" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#142c46">Native replay of two retained source cases. The other edition is excluded, not made false.</text></svg>