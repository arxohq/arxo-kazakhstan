<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="315" viewBox="0 0 1280 315" role="img"><title>Pinned model plus facts and date produce an answer with evidence</title><rect width="1280" height="315" rx="22" fill="#f5f0e6"/><text x="32" y="48" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#142c46">FROM THE MODEL TO A REPLAYABLE ANSWER</text><rect x="32" y="83" width="268" height="148" rx="14" fill="#fff" stroke="#ced8d9"/><text x="50" y="120" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142c46">Pinned world</text><text x="50" y="166" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#142c46">Original .law + sources</text><text x="50" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142c46">Selected modules</text><path d="M310 157h28l-7-7m7 7-7 7" fill="none" stroke="#247c89" stroke-width="3"/><rect x="347" y="83" width="268" height="148" rx="14" fill="#fff" stroke="#ced8d9"/><text x="365" y="120" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142c46">Case</text><text x="365" y="166" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#142c46">Facts + legal date</text><text x="365" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142c46">Explicit reading when needed</text><path d="M625 157h28l-7-7m7 7-7 7" fill="none" stroke="#247c89" stroke-width="3"/><rect x="662" y="83" width="268" height="148" rx="14" fill="#fff" stroke="#ced8d9"/><text x="680" y="120" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142c46">Answer</text><text x="680" y="166" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#142c46">Truth + positions + issues</text><text x="680" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142c46">Separate evaluation status</text><path d="M940 157h28l-7-7m7 7-7 7" fill="none" stroke="#247c89" stroke-width="3"/><rect x="977" y="83" width="268" height="148" rx="14" fill="#fff" stroke="#ced8d9"/><text x="995" y="120" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142c46">Evidence</text><text x="995" y="166" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#142c46">Canonical document</text><text x="995" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#142c46">Proof graph + model anchors</text><text x="32" y="276" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#142c46">The CLI executes the model. The examples contain no separate legal calculator.</text></svg>