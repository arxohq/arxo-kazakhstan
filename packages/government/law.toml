# Манифест §10 — маркер корня пакета (DECISION-0033). Нормативны заголовки §22
# в самих .law; манифест обязан с ними совпадать (LDC-E1109, lawc check).
[package]
name = "kz.constitution.government"
version = "0.1.0"
language = "0.2"
namespace = "urn:kz:constitution:government"

# Каталожная метадата (DECISION-0051; docs/PACKAGE-METADATA.ru.md). НЕ семантика:
# в CLIR не понижается, в semantic hash §209 не входит.
# Выводимые поля (jurisdiction, instrument, sourceFidelity) НЕ объявлены
# намеренно: пакета нет в реестре LOWERED_ACTS `corpus/gen_kz_clir.py`, по
# которому ворота ci/check_package_metadata.py находят CLIR, и сверить
# заявленное с source-декларациями им не с чем. Объявить их значило бы
# получить поля, которые никто не проверяет.
[metadata]
act = "kz-constitution-government"
title = "Конституция РК 2026: Правительство и Қазақстан Халық Кеңесі"
# legalStatus: `in_force` — подпакет раздела действующей Конституции 2026 года.
legalStatus = "in_force"

[authoring]
local_imports = "explicit"
